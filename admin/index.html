<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redigér Privatvicevært</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
  <script>
    var createClass = window.createClass;
    var h = window.h;

    var PreviewComponent = createClass({
      setFrame: function (el) {
        this.frame = el;
        if (el) { this.sendUpdate(); }
      },
      sendUpdate: function () {
        if (!this.frame || !this.frame.contentWindow) return;
        var entry = this.props.entry;
        var data = entry.get('data') ? entry.get('data').toJS() : {};
        this.frame.contentWindow.postMessage({ type: 'cms-preview-update', content: data }, window.location.origin);
      },
      componentDidUpdate: function () {
        this.sendUpdate();
      },
      handleLoad: function () {
        this.sendUpdate();
      },
      render: function () {
        return h('iframe', {
          src: '/',
          ref: this.setFrame,
          onLoad: this.handleLoad,
          title: 'Forhåndsvisning af privatvicevaert.dk',
          style: { width: '100%', height: '100vh', border: 'none', background: '#fff' }
        });
      }
    });

    if (window.CMS) {
      window.CMS.registerPreviewTemplate('content', PreviewComponent);
    }
  </script>
</body>
</html>
