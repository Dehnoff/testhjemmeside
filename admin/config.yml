backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "indhold"
    label: "Hjemmeside-indhold"
    files:
      - file: "content.json"
        label: "Rediger tekster, priser og billeder"
        name: "content"
        fields:
          - label: "Forside (hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Lille tekst over overskrift", name: "eyebrow", widget: "string" }
              - { label: "Stor overskrift", name: "title", widget: "string" }
              - { label: "Introtekst", name: "lead", widget: "text" }
              - { label: "Billede", name: "image", widget: "image", choose_url: true }
              - { label: "Tal 1", name: "stat1_num", widget: "string" }
              - { label: "Tekst under tal 1", name: "stat1_lbl", widget: "string" }
              - { label: "Tal 2", name: "stat2_num", widget: "string" }
              - { label: "Tekst under tal 2", name: "stat2_lbl", widget: "string" }
              - { label: "Tal 3", name: "stat3_num", widget: "string" }
              - { label: "Tekst under tal 3", name: "stat3_lbl", widget: "string" }
          - label: "Kontaktinfo"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Telefonnummer", name: "phone", widget: "string" }
              - { label: "E-mail", name: "email", widget: "string" }
          - label: "Footer (bund af siden)"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Kort beskrivelse af firmaet", name: "tagline", widget: "text" }
              - { label: "Områder I dækker", name: "areas", widget: "string" }
              - { label: "Åbningstider", name: "hours", widget: "string" }
              - { label: "Copyright-tekst", name: "copyright", widget: "string" }
          - label: "Priser (de 9 pakker på Pakker-siden, i rækkefølge)"
            name: "prices"
            widget: "object"
            fields:
              - { label: "Pris 1 — Sommerklar have", name: "price_1", widget: "string" }
              - { label: "Pris 2 — Fast rengøring", name: "price_2", widget: "string" }
              - { label: "Pris 3 — To-do-listen ryddet", name: "price_3", widget: "string" }
              - { label: "Pris 4 — Klare vinduer", name: "price_4", widget: "string" }
              - { label: "Pris 5 — Vintertjeneste", name: "price_5", widget: "string" }
              - { label: "Pris 6 — Bede & beplantning", name: "price_6", widget: "string" }
              - { label: "Pris 7 — Boligtilsyn ved ferie", name: "price_7", widget: "string" }
              - { label: "Pris 8 — Indkøb & ærinder", name: "price_8", widget: "string" }
              - { label: "Pris 9 — Tagrender & facade", name: "price_9", widget: "string" }
          - label: "Anmeldelser (testimonials)"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Anmeldelse 1 (Mette & Jonas)", name: "testi_1", widget: "text" }
              - { label: "Anmeldelse 2 (Birthe & Erik)", name: "testi_2", widget: "text" }
              - { label: "Anmeldelse 3 (Anders K.)", name: "testi_3", widget: "text" }
          - label: "Billeder (alle billeder på siden, i rækkefølge)"
            name: "images"
            widget: "object"
            fields:
              - { label: "Forside – Have & udendørs (kort)", name: "img_1", widget: "image", choose_url: true }
              - { label: "Forside – Rengøring (kort)", name: "img_2", widget: "image", choose_url: true }
              - { label: "Forside – Småreparationer (kort)", name: "img_3", widget: "image", choose_url: true }
              - { label: "Anmeldelse – portræt af Mette", name: "img_4", widget: "image", choose_url: true }
              - { label: "Anmeldelse – portræt af Birthe", name: "img_5", widget: "image", choose_url: true }
              - { label: "Anmeldelse – portræt af Anders", name: "img_6", widget: "image", choose_url: true }
              - { label: "Om os – vicevært giver hånd ved døren", name: "img_7", widget: "image", choose_url: true }
              - { label: "Om os – vicevært med værktøj", name: "img_8", widget: "image", choose_url: true }
              - { label: "Om os – hjem set indefra", name: "img_9", widget: "image", choose_url: true }
              - { label: "Services – Havearbejde", name: "img_10", widget: "image", choose_url: true }
              - { label: "Services – Bede & beplantning", name: "img_11", widget: "image", choose_url: true }
              - { label: "Services – Rengøring", name: "img_12", widget: "image", choose_url: true }
              - { label: "Services – Vinduespudsning", name: "img_13", widget: "image", choose_url: true }
              - { label: "Services – Småreparationer", name: "img_14", widget: "image", choose_url: true }
              - { label: "Services – Tagrender & facade", name: "img_15", widget: "image", choose_url: true }
              - { label: "Services – Snerydning & grusning", name: "img_16", widget: "image", choose_url: true }
              - { label: "Services – Indkøb & ærinder", name: "img_17", widget: "image", choose_url: true }
              - { label: "Services – Boligtilsyn ved ferie", name: "img_18", widget: "image", choose_url: true }
              - { label: "Services – Maling & opfriskning", name: "img_19", widget: "image", choose_url: true }
              - { label: "Services – Forårs- & vinterklargøring", name: "img_20", widget: "image", choose_url: true }
              - { label: "Services – Forebyggende tjek", name: "img_21", widget: "image", choose_url: true }
              - { label: "Pakker – Sommerklar have", name: "img_22", widget: "image", choose_url: true }
              - { label: "Pakker – Fast rengøring", name: "img_23", widget: "image", choose_url: true }
              - { label: "Pakker – To-do-listen ryddet", name: "img_24", widget: "image", choose_url: true }
              - { label: "Pakker – Klare vinduer", name: "img_25", widget: "image", choose_url: true }
              - { label: "Pakker – Vintertjeneste", name: "img_26", widget: "image", choose_url: true }
              - { label: "Pakker – Bede & beplantning", name: "img_27", widget: "image", choose_url: true }
              - { label: "Pakker – Boligtilsyn ved ferie", name: "img_28", widget: "image", choose_url: true }
              - { label: "Pakker – Indkøb & ærinder", name: "img_29", widget: "image", choose_url: true }
              - { label: "Pakker – Tagrender & facade", name: "img_30", widget: "image", choose_url: true }
